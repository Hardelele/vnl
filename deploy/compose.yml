# Выкладка VNL через docker.
#
#   cd /opt/vnl && docker compose -f deploy/compose.yml up -d --build
#
# Наружу приложение выпускает nginx на хосте, а не docker. Поэтому порт
# публикуется на `127.0.0.1` -- строка `127.0.0.1:8765:8765`, а не `8765:8765`.
# Разница не косметическая: docker правит iptables сам и публикация на все адреса
# открывает порт в интернет мимо фаервола хоста. У приложения нет авторизации, а
# его API умеет создавать и удалять паттерны -- открытый порт означает, что
# библиотеку может стереть любой желающий.
#
# Один сервис и один процесс. Симуляции считаются в фоновых потоках самого
# процесса и живут в памяти: масштабировать это репликами нельзя -- сессия,
# открытая одной репликой, для другой не существует. Отсюда же отсутствие
# `deploy.replicas` и запрет на `docker compose up --scale`.

services:
  app:
    build:
      # Контекст -- корень репозитория: в образ едут и src/, и ui/, и design/.
      context: ..
      dockerfile: Dockerfile
    image: vnl:local
    container_name: vnl
    restart: unless-stopped

    # Хранилище. Именованный том, а не bind-mount: данные не зависят от того,
    # где лежит код, и выкладка нового образа их не касается.
    volumes:
      - vnl-data:/var/lib/vnl

    # Только loopback хоста. Менять на 0.0.0.0 нельзя, см. комментарий выше.
    ports:
      - "127.0.0.1:8765:8765"

    # Команда со всеми путями и флагами задана в Dockerfile. Менять её здесь
    # нужно только затем, чтобы что-то переопределить, например убрать
    # `--quiet` и увидеть обращения приложения отдельно от лога nginx:
    #
    #   command: ["vnl", "serve", "--bind", "0.0.0.0", "--port", "8765",
    #             "--root", "/var/lib/vnl", "--ui", "/app/ui/dist"]

    # Настройки безопасности: приложению не нужны ни новые права, ни запись в
    # корень контейнера. Всё, что оно пишет, лежит в томе.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

    # Симуляции считают в потоках без ограничений сверху; предел по памяти
    # спасает хост от одной тяжёлой модели. Поднять, если моделям тесно.
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  vnl-data:

# --- вариант без публикации порта ------------------------------------------
#
# Если хочется, чтобы приложение само привязывалось к loopback хоста (как при
# запуске из командной строки), вместо `ports` берут сеть хоста:
#
#   services:
#     app:
#       network_mode: host
#       environment:
#         VNL_BIND: 127.0.0.1
#       # ports: не указывать -- при network_mode: host они игнорируются
#
# Тогда сокет приложения и есть 127.0.0.1:8765 хоста, и флаг --bind
# сводится к обычному `vnl serve`. Платой идёт общее с хостом сетевое
# пространство (контейнер видит все его порты) и то, что это работает только на
# Linux. Выбирать по вкусу администратора: обе дороги дают один результат --
# порт, доступный лишь с самой машины.
