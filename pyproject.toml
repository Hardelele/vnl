[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vnl"
version = "0.1.0"
description = "Язык описания нейронных микросхем и компилятор к симуляторам"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Индекс метаданных в Postgres -- отдельная установка: без него инструмент
# работает, читая каталог из файлов, и остаётся без зависимостей.
index = ["psycopg[binary]>=3.1"]
netpyne = ["netpyne>=1.0"]

[project.scripts]
vnl = "vnl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
